name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -R media dist/media
      - name: Enviar os arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
